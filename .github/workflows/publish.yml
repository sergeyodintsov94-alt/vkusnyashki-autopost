name: Публикация в Instagram

on:
  schedule:
    - cron: "*/15 * * * *"   # каждые 15 минут проверяет очередь
  workflow_dispatch:
    inputs:
      command:
        description: "Команда: run (опубликовать то, что пора), check (проверить подключение), list (показать очередь)"
        default: "run"

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Запуск
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLIC_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
          GRAPH_HOST: ${{ vars.GRAPH_HOST }}
        run: python publish.py ${{ github.event.inputs.command || 'run' }}
      - name: Сохранить статусы очереди
        run: |
          git config user.name "autopost"
          git config user.email "autopost@users.noreply.github.com"
          git add queue.json
          git diff --cached --quiet || (git commit -m "Обновлены статусы публикаций" && git push)
